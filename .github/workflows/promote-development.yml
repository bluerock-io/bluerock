# auto-promote development → main after CI passes on development.
# this is the path that handles dependabot merges and community PRs
# that land directly on development (i.e. without going through the
# upstream staging builder).
#
# the upstream staging builder configures its commits with a known
# service-account email as committer. we skip those here — they've
# already been promoted upstream. using the committer email (rather
# than a trailer in the commit message) prevents community contributors
# from spoofing the skip signal in a PR body. the email literal is
# kept out of this workflow source and read from the repo-level
# variable CI_GIT_AUTHOR_EMAIL instead.
name: Promote Development

on:
  push:
    branches: [development]

# serialize promotions so concurrent merges (e.g. two dependabot PRs
# landing close together) run in strict order. without this, a later
# run could advance main past a still-in-flight earlier run's target
# and cause a fast-forward failure.
concurrency:
  group: promote-development
  cancel-in-progress: false

permissions: {}

jobs:
  promote:
    # skip commits produced by the upstream staging builder. the staging
    # builder sets committer.email to the service-account value before
    # it runs commit-tree, so this is the authoritative signal. a
    # community PR cannot forge this committer email on merge — github
    # rewrites the committer for squash/rebase merges and for direct
    # pushes the committer identity is set from the actor's verified
    # identity. the canonical email value lives in the repo variable
    # CI_GIT_AUTHOR_EMAIL so rotations don't require a code change.
    if: "github.event.head_commit.committer.email != vars.CI_GIT_AUTHOR_EMAIL"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # short-circuit when development already equals main. the post-promote
      # resync below force-pushes development back to main, which itself
      # fires this workflow again; without this guard that follow-on run
      # would sit through a full CI poll only to no-op. comparing branch
      # tips lets it exit in seconds instead.
      - name: Check whether development already equals main
        id: sync_check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          DEV=$(gh api "repos/$REPO/branches/development" --jq '.commit.sha')
          MAIN=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
          if [ "$DEV" = "$MAIN" ]; then
            echo "development already at main ($MAIN); nothing to promote."
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CI checks on development
        if: steps.sync_check.outputs.in_sync != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        # reuse the shared poll-github-ci.sh so tracked-workflow names
        # and expected counts stay in sync with the upstream checks.
        # a previous inline implementation here drifted from the shared
        # script and skipped newly-added required workflows.
        run: |
          bash .github/scripts/poll-github-ci.sh \
            --repo "$REPO" \
            --token "$GH_TOKEN" \
            --sha "$COMMIT_SHA"

      - name: Promote development → main
        if: steps.sync_check.outputs.in_sync != 'true'
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -eo pipefail

          # confirm the token can authenticate before any push.
          if ! gh api user --jq '"authenticated as: \(.login)"'; then
            echo "::error::token authentication failed; rotate PROMOTE_TOKEN and re-run."
            exit 1
          fi

          PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          # try a fast-forward push.
          if git push "$PUSH_URL" "${COMMIT_SHA}:refs/heads/main" 2>/dev/null; then
            echo "Promoted: main now at $COMMIT_SHA (fast-forward)"
            exit 0
          fi

          # fallback: open a pr from development to main and squash-merge it.
          # github's squash-merge produces a single web-flow-signed commit on
          # main, satisfying both linear-history and signed-commits rules.
          echo "fast-forward not possible; opening pr for squash-merge..."
          DEV_SHORT=$(printf '%s' "$COMMIT_SHA" | cut -c1-10)
          PR_URL=$(gh pr create \
            --base main --head development \
            --title "Promote development → main ($DEV_SHORT)" \
            --body "Auto-promote after CI green on development." \
            --label automation 2>/dev/null \
            || gh pr list --base main --head development --state open --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            echo "::error::could not create or find a pr from development to main."
            exit 1
          fi
          PR_NUM=$(printf '%s' "$PR_URL" | grep -oE '[0-9]+$')
          if ! gh pr merge "$PR_NUM" --squash --admin --delete-branch=false; then
            echo "::error::squash-merge of pr #$PR_NUM failed."
            exit 1
          fi
          echo "Promoted: main advanced via pr #$PR_NUM (squash)"

          # re-sync development onto the freshly promoted main. a squash-merge
          # writes a new commit on main with no parent link back to development,
          # so the two branches drift after every promote; the next dependabot
          # bump that touches the same lines then fails to squash-merge because
          # git treats main's squash and development's originals as conflicting
          # concurrent edits. resetting development to main restores shared
          # ancestry so future promotes stay clean.
          #
          # --force-with-lease only overwrites development if it is still at the
          # commit this run promoted — if a dependabot PR raced in afterward the
          # lease fails and we leave it for the queued promote. resync is
          # best-effort: a failure must not fail an otherwise successful promote.
          git fetch "$PUSH_URL" main
          NEW_MAIN=$(git rev-parse FETCH_HEAD)
          if git push --force-with-lease=refs/heads/development:"$COMMIT_SHA" \
               "$PUSH_URL" "${NEW_MAIN}:refs/heads/development" 2>/dev/null; then
            echo "Re-synced development → main ($NEW_MAIN)"
          else
            echo "::warning::could not resync development to main (branch protection, missing bypass, or a raced merge). resync manually with: git push --force-with-lease origin main:development"
          fi
